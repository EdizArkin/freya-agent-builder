    {
      "id": "SC-01",
      "title": "There is no callback tool in this agent",
      "category": "brief_c",
      "brief": "C",
      "tier": "runtime",
      "mode": "offline",
      "requirements": [
        "C-02"
      ],
      "customer": {
        "identity": {
          "postcode": "NW14RT",
          "birth_year": "1979"
        },
        "products": [
          {
            "type": "store_card",
            "card_last4": "6120",
            "past_due": 300.0,
            "days_late": 12,
            "plan_active": false
          }
        ],
        "variables": {
          "first_name": "Imani",
          "last_name": "Brandt"
        }
      },
      "behavior": "Someone else answers and offers a time to call back.",
      "steps": [
        {
          "check": {
            "node": "contact",
            "tools": [
              "verify_identity",
              "transfer_to_agent",
              "close_call"
            ]
          }
        },
        {
          "call": "schedule_callback",
          "args": {
            "date": "2026-10-15",
            "time": "11:00"
          },
          "expect": "unavailable"
        },
        {
          "call": "close_call",
          "args": {
            "outcome": "not_reached",
            "reason": "no_callback"
          },
          "expect": "ok"
        }
      ],
      "spoken": [
        "The agent says it will call again and gives no reason."
      ],
      "strategy": "Offline, deterministic: the harness plays these tool calls against the generated workflow and checks how each ends, what the model is told and what the bank holds afterwards."
    },
