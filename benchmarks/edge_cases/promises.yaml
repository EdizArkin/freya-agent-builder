          "expect": "ok"
        },
        {
          "call": "verify_identity",
          "args": {
            "field": "phone_last4",
            "answer": "2040"
          },
          "expect": "ok"
        },
        {
          "call": "create_promise",
          "args": {
            "product_id": "p1",
            "amount": 143.99,
            "date": "2026-10-16"
          },
          "expect": "refused",
          "says": [
            "below the lowest amount",
            "144.00"
          ]
        },
        {
          "call": "create_promise",
          "args": {
            "product_id": "p1",
            "amount": 144.0,
            "date": "2026-10-16"
          },
          "expect": "ok",
          "says": [
            "is now recorded"
          ]
        },
        {
          "call": "close_call",
          "args": {
            "outcome": "promise"
          },
          "expect": "ok"
