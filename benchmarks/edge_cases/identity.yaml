  "category": "identity",
  "scenarios": [
    {
      "id": "EC-ID-01",
      "title": "Account tools do not exist before verification",
      "category": "identity",
      "brief": "B",
      "tier": "runtime",
      "mode": "offline",
      "requirements": [
        "A-10",
        "A-16"
      ],
      "customer": {
        "identity": {
          "date_of_birth": "1985-06-09",
          "phone_last4": "2040"
        },
        "products": [
          {
            "type": "credit_card",
            "card_last4": "7312",
            "past_due": 480.0,
            "days_late": 12,
            "minimum_payment": 144.0
          }
        ]
      },
      "behavior": "The agent tries to look at the account and to record things before any security question was answered.",
      "steps": [
        {
          "check": {
            "node": "contact",
            "tools": [
              "verify_identity",
              "schedule_callback",
              "transfer_to_agent",
              "close_call"
            ]
          }
        },
        {
          "call": "get_account",
          "expect": "unavailable"
        },
        {
          "call": "create_promise",
          "args": {
            "product_id": "p1",
            "amount": 480,
            "date": "2026-10-16"
          },
          "expect": "unavailable"
        },
        {
          "call": "add_note",
          "args": {
            "product_id": "p1",
            "reason": "refused"
          },
          "expect": "unavailable"
        },
        {
          "call": "close_call",
          "args": {
            "outcome": "not_verified",
            "reason": "declined"
          },
          "expect": "ok"
        }
      ],
      "spoken": [
        "Nothing about the account is said."
      ],
      "strategy": "Offline, deterministic: the harness plays these tool calls against the generated workflow and checks how each ends, what the model is told and what the bank holds afterwards."
    },
